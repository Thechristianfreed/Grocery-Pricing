name: Update prices

# Runs by itself every morning. Reads this week's store ads and publishes
# prices.json + history.json on the `data` branch, which the app downloads.
on:
  schedule:
    - cron: "17 13 * * *"   # 5:17 or 6:17 am Pacific
  workflow_dispatch:
  push:
    paths: ["scraper/**", ".github/workflows/update-prices.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch (create it on first run)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add data-out FETCH_HEAD
            git -C data-out checkout -B data
          else
            git worktree add --detach data-out
            git -C data-out checkout --orphan data
            git -C data-out rm -rfq .
          fi

      - name: Fetch prices
        run: python3 scraper/fetch_prices.py --out data-out

      - name: Publish
        run: |
          cd data-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json history.json
          git commit -qm "Prices $(date -u +%F)"
          git push origin data

      # GitHub pauses scheduled jobs after 60 days without repository activity.
      # Re-enabling the workflow resets that clock, so this keeps running unattended.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-prices.yml/enable" || true
