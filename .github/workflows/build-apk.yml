name: Build app

# Builds the Android app and publishes it as a download:
# https://github.com/<owner>/<repo>/releases/latest/download/grocery-prices.apk
on:
  workflow_dispatch:
  push:
    paths: ["app/**", "*.kts", "gradle/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk grocery-prices.apk
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" grocery-prices.apk --target "${{ github.sha }}" \
            --title "Sac Grocery Prices $tag" \
            --notes "Download grocery-prices.apk on your phone and open it to install or update."
